<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no">
    <title>Calculadora de Abscisa - Red Vial</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shpjs/4.0.4/shp.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">


</head>
<body>
    <div class="header">
        <h1><i class="fas fa-map-marker-alt"></i> Calculadora de Abscisa</h1>
        <p>Red Vial Departamental - Posición kilométrica</p>
        <div class="author">© 2025 - Desarrollado por Oscar Marquez</div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Cambiar tema">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="main-container">
        <div class="sidebar">
            <div class="input-section">
                <div class="input-group">
                    <h3><i class="fas fa-road"></i> Tipo de Red Vial</h3>
                    <div class="road-selector">
                        <button class="road-type-btn active" data-type="primaria">Primaria</button>
                        <button class="road-type-btn" data-type="secundaria">Secundaria</button>
                        <button class="road-type-btn" data-type="terciaria">Terciaria</button>
                    </div>
                </div>

                <div class="input-group">
                    <h3><i class="fas fa-crosshairs"></i> Coordenadas</h3>
                    <div class="coordinate-inputs">
                        <input type="text" id="longitude" placeholder="Longitud (ej: -75.5636 o 75 39 52 W)" step="any">
                        <input type="text" id="latitude" placeholder="Latitud (ej: 6.2442 o 6 11 23 N)" step="any">
                    </div>
                    <button id="calculateBtn" class="calculate-btn" disabled>
                        <i class="fas fa-calculator"></i> Calcular Abscisa
                    </button>
                </div>
            </div>

            <div id="results" class="results">
                <div id="resultContent"></div>
            </div>
        </div>

        <div class="map-container">
            <div id="loadingOverlay" class="loading-overlay">
                <div class="loading-spinner"></div>
                <p>Cargando mapa...</p>
            </div>
            <div id="map"></div>

            <!-- Menú unificado que aparece a la izquierda -->
            <div id="unifiedMenu" class="collapsible-menu" style="top: 20px; right: 120px;">
                <div class="menu-header">
                    <div class="menu-title">
                        <i class="fas fa-cog menu-icon"></i>
                        <span id="menuTitle">Opciones</span>
                    </div>
                    <i class="fas fa-chevron-down menu-toggle"></i>
                </div>
                <div class="menu-content expanded">
                    <div class="menu-options" id="menuOptions">
                        <!-- El contenido se carga dinámicamente -->
                    </div>
                </div>
            </div>

            <div class="coordinate-display" id="coordinateDisplay">
                Lat: ---, Lon: --- <span id="measurementDisplay"></span>
            </div>

            <div class="map-controls">
                <button id="basemapMenuBtn" class="map-btn" title="Cambiar mapa base">
                    <i class="fas fa-map"></i>
                </button>
                <button id="toolsMenuBtn" class="map-btn" title="Herramientas">
                    <i class="fas fa-tools"></i>
                </button>
            </div>

            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 10px rgba(239, 68, 68, 0.3);"></div>
                    <span>Vía más cercana</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: linear-gradient(135deg, #8b5cf6, #7c3aed);"></div>
                    <span>Otras vías</span>
                </div>
                <div class="legend-item">
                    <div class="legend-point" style="background: linear-gradient(135deg, #06b6d4, #0891b2);"></div>
                    <span>Punto ingresado</span>
                </div>
                <div class="legend-item">
                    <div class="legend-point" style="background: linear-gradient(135deg, #10b981, #059669);"></div>
                    <span>Punto sobre vía</span>
                </div>
                <div class="legend-item">
                    <div class="legend-point" style="background: linear-gradient(135deg, #f59e0b, #d97706);"></div>
                    <span>Inicio de vía</span>
                </div>
            </div>
            
            <!-- Status de herramientas -->
            <div class="tool-status" id="toolStatus">
                <i class="fas fa-info-circle"></i> <span id="toolStatusText"></span>
            </div>
            
            <!-- Panel de resultados de medición -->
            <div class="measurement-result" id="measurementResult">
                <button class="close-btn" onclick="hideMeasurementResult()"><i class="fas fa-times"></i></button>
                <div id="measurementContent">
                    <h4><i class="fas fa-chart-line"></i> Resultados</h4>
                    <div id="measurementData"></div>
                    <div id="measurementExtra"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ===========================
        // SISTEMA DE ALERTAS SIMULADO
        // ===========================
        const alertSystem = {
            success: (title, message, duration) => console.log(`✅ ${title}: ${message}`),
            error: (title, message, duration) => console.log(`❌ ${title}: ${message}`),
            info: (title, message, duration) => console.log(`ℹ️ ${title}: ${message}`),
            warning: (title, message, duration) => console.log(`⚠️ ${title}: ${message}`)
        };

        function showSuccess(title, message, duration) { alertSystem.success(title, message, duration); }
        function showError(title, message, duration) { alertSystem.error(title, message, duration); }
        function showInfo(title, message, duration) { alertSystem.info(title, message, duration); }
        function showWarning(title, message, duration) { alertSystem.warning(title, message, duration); }
        function showSuccessReplace(title, message, duration) { alertSystem.success(title, message, duration); }
        function showInfoReplace(title, message, duration) { alertSystem.info(title, message, duration); }
        function clearAllAlerts() { console.log('🧹 Alertas limpiadas'); }

        // ===========================
        // SISTEMA DE MENÚS INTEGRADO
        // ===========================
        class SimpleMenuSystem {
            constructor() {
                this.activeMenu = null;
                this.currentMenuType = null;
                this.init();
            }

            init() {
                // Eventos para cerrar menús al hacer clic fuera
                document.addEventListener('click', (e) => {
                    if (!e.target.closest('.collapsible-menu') && !e.target.closest('.map-btn')) {
                        this.closeAllMenus();
                    }
                });

                // Eventos de teclado
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') {
                        this.closeAllMenus();
                    }
                });
            }

            showMenu(menuType) {
                this.closeAllMenus();
                const menu = document.getElementById('unifiedMenu');
                if (menu) {
                    this.loadMenuContent(menuType);
                    menu.classList.add('show');
                    this.activeMenu = 'unifiedMenu';
                    this.currentMenuType = menuType;
                }
            }

            hideMenu() {
                const menu = document.getElementById('unifiedMenu');
                if (menu) {
                    menu.classList.remove('show');
                    this.activeMenu = null;
                    this.currentMenuType = null;
                }
            }

            closeAllMenus() {
                this.hideMenu();
            }

            loadMenuContent(menuType) {
                const menuTitle = document.getElementById('menuTitle');
                const menuOptions = document.getElementById('menuOptions');
                const menuIcon = document.querySelector('#unifiedMenu .menu-icon');
                
                if (menuType === 'basemap') {
                    menuTitle.textContent = 'Mapa Base';
                    menuIcon.className = 'fas fa-map menu-icon';
                    menuOptions.innerHTML = `
                        <button class="menu-option" data-basemap="osm">
                            <i class="fas fa-map option-icon"></i>
                            <span class="option-label">Estándar</span>
                            <span class="option-badge" id="osm-badge">✓</span>
                        </button>
                        <button class="menu-option" data-basemap="cyclosm">
                            <i class="fas fa-bicycle option-icon"></i>
                            <span class="option-label">CyclOSM</span>
                            <span class="option-badge" id="cyclosm-badge" style="display: none;">✓</span>
                        </button>
                        <button class="menu-option" data-basemap="topo">
                            <i class="fas fa-mountain option-icon"></i>
                            <span class="option-label">Topográfico</span>
                            <span class="option-badge" id="topo-badge" style="display: none;">✓</span>
                        </button>
                        <button class="menu-option" data-basemap="satellite">
                            <i class="fas fa-satellite option-icon"></i>
                            <span class="option-label">Satélite</span>
                            <span class="option-badge" id="satellite-badge" style="display: none;">✓</span>
                        </button>
                    `;
                    this.setupBasemapEvents();
                    this.updateBasemapBadges();
                } else if (menuType === 'tools') {
                    menuTitle.textContent = 'Herramientas';
                    menuIcon.className = 'fas fa-tools menu-icon';
                    menuOptions.innerHTML = `
                        <button class="menu-option" id="viewAllRoads">
                            <i class="fas fa-eye option-icon"></i>
                            <span class="option-label">Ver Todas las Vías</span>
                        </button>
                        <button class="menu-option" id="centerOnResult">
                            <i class="fas fa-location-arrow option-icon"></i>
                            <span class="option-label">Centrar en Resultado</span>
                        </button>
                        <div class="menu-separator"></div>
                        <button class="menu-option" id="measureDistance">
                            <i class="fas fa-ruler option-icon"></i>
                            <span class="option-label">Medir Distancia</span>
                            <span class="option-shortcut">D</span>
                        </button>
                        <button class="menu-option" id="measureArea">
                            <i class="fas fa-draw-polygon option-icon"></i>
                            <span class="option-label">Medir Área</span>
                            <span class="option-shortcut">A</span>
                        </button>
                        <div class="menu-separator"></div>
                        <button class="menu-option danger" id="clearMap">
                            <i class="fas fa-trash option-icon"></i>
                            <span class="option-label">Limpiar Mapa</span>
                        </button>
                        <button class="menu-option warning" id="clearMeasurement">
                            <i class="fas fa-eraser option-icon"></i>
                            <span class="option-label">Borrar Medición</span>
                        </button>
                    `;
                    this.setupToolsEvents();
                    this.updateToolsStates();
                }
            }

            setupBasemapEvents() {
                document.querySelectorAll('#unifiedMenu .menu-option[data-basemap]').forEach(option => {
                    option.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const basemapType = option.dataset.basemap;
                        if (basemapType) {
                            changeBaseLayer(basemapType);
                            this.updateBasemapBadges();
                            this.hideMenu();
                        }
                    });
                });
            }

            setupToolsEvents() {
                const events = {
                    'viewAllRoads': () => { showAllRoads(); this.hideMenu(); },
                    'centerOnResult': () => { centerOnResult(); this.hideMenu(); },
                    'measureDistance': () => { activateTool('distance'); this.hideMenu(); },
                    'measureArea': () => { activateTool('area'); this.hideMenu(); },
                    'clearMap': () => { clearMap(); this.hideMenu(); },
                    'clearMeasurement': () => { clearMeasurement(); this.hideMenu(); }
                };

                Object.entries(events).forEach(([id, handler]) => {
                    const element = document.getElementById(id);
                    if (element) {
                        element.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handler();
                        });
                    }
                });
            }

            updateBasemapBadges() {
                const badges = ['osm', 'cyclosm', 'topo', 'satellite'];
                badges.forEach(type => {
                    const badge = document.getElementById(`${type}-badge`);
                    if (badge) {
                        badge.style.display = currentBaseLayer === type ? 'inline' : 'none';
                    }
                });
            }

            updateToolsStates() {
                const viewAllRoads = document.getElementById('viewAllRoads');
                if (viewAllRoads) {
                    if (!geojsonData) {
                        viewAllRoads.classList.add('disabled');
                    } else {
                        viewAllRoads.classList.remove('disabled');
                    }
                }

                const centerOnResult = document.getElementById('centerOnResult');
                if (centerOnResult) {
                    if (!currentResult) {
                        centerOnResult.classList.add('disabled');
                    } else {
                        centerOnResult.classList.remove('disabled');
                    }
                }
            }
        }

        const menuSystem = new SimpleMenuSystem();

        // ===========================
        // VARIABLES GLOBALES
        // ===========================
        let geojsonData = null;
        let map = null;
        let roadsLayer = null;
        let markersLayer = null;
        let measurementLayer = null;
        let currentResult = null;
        let currentRoadType = 'primaria';
        let loadedRoads = {};
        let coordinateDisplay = null;
        let baseLayers = {};
        let currentBaseLayer = 'osm';
        let activeTool = null;
        let measurementPoints = [];
        let measurementLine = null;
        let measurementPolygon = null;
        let currentRoadColor = '#8b5cf6';
        let currentHighlightColor = '#ef4444';

        // Referencias a elementos DOM
        const longitudeInput = document.getElementById('longitude');
        const latitudeInput = document.getElementById('latitude');
        const calculateBtn = document.getElementById('calculateBtn');
        const results = document.getElementById('results');
        const resultContent = document.getElementById('resultContent');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const roadTypeButtons = document.querySelectorAll('.road-type-btn');
        const toolStatus = document.getElementById('toolStatus');
        const toolStatusText = document.getElementById('toolStatusText');
        const measurementDisplay = document.getElementById('measurementDisplay');


        
        // ===========================
        // FUNCIONES PRINCIPALES
        // ===========================

        // Función global para cerrar resultado de medición
        function hideMeasurementResult() {
            const resultDiv = document.getElementById('measurementResult');
            if (resultDiv) {
                resultDiv.style.display = 'none';
            }
        }

        // Inicializar aplicación
        document.addEventListener('DOMContentLoaded', function() {
            preventZoom();
            initializeMap();
            loadRoadData('primaria');
            setupEventListeners();
            setupMenus();
        });

        // Función para prevenir zoom completamente
        function preventZoom() {
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
            }, { passive: false });

            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
            }, { passive: false });

            let lastTouchEnd = 0;
            document.addEventListener('touchend', function(event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, { passive: false });

            document.addEventListener('touchmove', function(event) {
                if (event.scale !== 1) {
                    event.preventDefault();
                }
            }, { passive: false });

            const viewport = document.querySelector('meta[name=viewport]');
            if (viewport) {
                viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no');
            }

            const inputs = document.querySelectorAll('input, textarea, select');
            inputs.forEach(input => {
                input.addEventListener('focus', function(e) {
                    e.target.style.fontSize = '16px';
                });
            });
        }

        // Configurar menús
        function setupMenus() {
            // Eventos de botones principales
            document.getElementById('basemapMenuBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                if (menuSystem.activeMenu && menuSystem.currentMenuType === 'basemap') {
                    menuSystem.hideMenu();
                } else {
                    menuSystem.showMenu('basemap');
                }
            });

            document.getElementById('toolsMenuBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                if (menuSystem.activeMenu && menuSystem.currentMenuType === 'tools') {
                    menuSystem.hideMenu();
                } else {
                    menuSystem.showMenu('tools');
                }
            });

            // Evento del header del menú unificado
            document.querySelector('#unifiedMenu .menu-header').addEventListener('click', (e) => {
                e.stopPropagation();
                const menu = document.getElementById('unifiedMenu');
                const content = menu.querySelector('.menu-content');
                const header = menu.querySelector('.menu-header');
                
                if (content.classList.contains('expanded')) {
                    content.classList.remove('expanded');
                    header.classList.remove('active');
                } else {
                    content.classList.add('expanded');
                    header.classList.add('active');
                }
            });

        }

        // Funciones de actualización simplificadas
        function updateBasemapBadges() {
            if (menuSystem.currentMenuType === 'basemap') {
                menuSystem.updateBasemapBadges();
            }
        }

        function updateMenuStates() {
            if (menuSystem.currentMenuType === 'tools') {
                menuSystem.updateToolsStates();
            }
        }

        // Configurar event listeners
        function setupEventListeners() {
            // Botones de tipo de red vial
            roadTypeButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    roadTypeButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentRoadType = this.dataset.type;
                    loadRoadData(currentRoadType);
                    
                    if (hasValidCoordinates()) {
                        setTimeout(() => {
                            if (geojsonData) {
                                calculateAbscissa();
                            }
                        }, 500);
                    }
                });
            });

            // Controles de entrada
            longitudeInput.addEventListener('input', function() {
                updateCalculateButton();
                autoCalculateIfReady();
            });
            latitudeInput.addEventListener('input', function() {
                updateCalculateButton();
                autoCalculateIfReady();
            });
            calculateBtn.addEventListener('click', calculateAbscissa);

            // Eventos globales
            document.addEventListener('keydown', handleKeyDown);
            document.addEventListener('contextmenu', handleRightClick);
        }

        // Auto-calcular cuando hay coordenadas válidas
        function autoCalculateIfReady() {
            if (hasValidCoordinates() && geojsonData) {
                setTimeout(() => {
                    calculateAbscissa();
                    setTimeout(() => {
                        clearAllAlerts();
                    }, 2000);
                }, 300);
            }
        }

        // Verificar si hay coordenadas válidas
        function hasValidCoordinates() {
            const coords = parseCoordinates();
            return coords.longitude !== null && coords.latitude !== null;
        }

        // Inicializar mapa
        function initializeMap() {
            if (map) return;
            
            map = L.map('map', {
                zoomControl: true,
                scrollWheelZoom: true,
                doubleClickZoom: true,
                boxZoom: true,
                keyboard: true,
                dragging: true,
                touchZoom: true,
                minZoom: 5,
                maxZoom: 19
            }).setView([6.2442, -75.5636], 10);
            map.setMaxZoom(17);
            // Definir capas base
            baseLayers = {
                osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors',
                    maxZoom: 19
                }),
                cyclosm: L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors, <a href="https://cyclosm.org">CyclOSM</a>',
                    maxZoom: 20
                }),
                topo: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
                    attribution: '© <a href="https://openstreetmap.org">OpenStreetMap</a> contributors, <a href="https://opentopomap.org">OpenTopoMap</a>',
                    maxZoom: 17
                }),
                satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                    attribution: '© <a href="https://www.esri.com/">Esri</a>, © <a href="https://www.digitalglobe.com/">DigitalGlobe</a>',
                    maxZoom: 19
                })
            };
            
            baseLayers[currentBaseLayer].addTo(map);
            
            roadsLayer = L.layerGroup().addTo(map);
            markersLayer = L.layerGroup().addTo(map);
            measurementLayer = L.layerGroup().addTo(map);

            coordinateDisplay = document.getElementById('coordinateDisplay');

            map.on('mousemove', function(e) {
                const lat = e.latlng.lat.toFixed(6);
                const lng = e.latlng.lng.toFixed(6);
                coordinateDisplay.innerHTML = `Lat: ${lat}, Lon: ${lng} ${measurementDisplay.innerHTML}`;
            });

            map.getContainer().addEventListener('mouseenter', function() {
                coordinateDisplay.style.display = 'block';
            });

            map.getContainer().addEventListener('mouseleave', function() {
                coordinateDisplay.style.display = 'none';
            });

            map.on('click', function(e) {
                if (e.originalEvent) {
                    e.originalEvent.preventDefault();
                    e.originalEvent.stopPropagation();
                }
                
                if (activeTool) {
                    handleToolClick(e);
                } else {
                    setTimeout(() => {
                        longitudeInput.value = e.latlng.lng.toFixed(6);
                        latitudeInput.value = e.latlng.lat.toFixed(6);
                        updateCalculateButton();
                        autoCalculateIfReady();
                    }, 10);
                }
            });

            map.on('contextmenu', function(e) {
                if (!activeTool) {
                    e.originalEvent.preventDefault();
                    
                    const lat = e.latlng.lat.toFixed(6);
                    const lng = e.latlng.lng.toFixed(6);
                    const coordText = `${lat}, ${lng}`;
                    
                    copyToClipboard(coordText);
                    showSuccess('Coordenadas copiadas', `Lon: ${lng}, Lat: ${lat}`, 3000);
                    
                    // Mostrar marcador temporal
                    showTemporaryMarker(e.latlng, coordText);
                }
            });

            map.on('dblclick', function(e) {
                if (e.originalEvent) {
                    e.originalEvent.preventDefault();
                    e.originalEvent.stopPropagation();
                }
                
                if (activeTool === 'distance' || activeTool === 'area') {
                    deactivateTool();
                    showSuccess('Medición completada', 'Doble clic para finalizar');
                }
            });

            map.getContainer().addEventListener('touchstart', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });

            map.getContainer().addEventListener('touchmove', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });

            setTimeout(() => {
                loadingOverlay.style.display = 'none';
            }, 1000);
        }

        // Cambiar capa base
        function changeBaseLayer(basemapType) {
            if (currentBaseLayer === basemapType) return;
            
            if (baseLayers[currentBaseLayer]) {
                map.removeLayer(baseLayers[currentBaseLayer]);
            }
            
            if (baseLayers[basemapType]) {
                baseLayers[basemapType].addTo(map);
                currentBaseLayer = basemapType;
                updateBasemapBadges();
               
            }
        }

        // Cargar datos de red vial
        async function loadRoadData(roadType) {
            if (loadedRoads[roadType]) {
                geojsonData = loadedRoads[roadType];
                showSuccessReplace('¡Completado!', `Red ${roadType} cargada (${getLineFeatures().length} vías)`, 4000);
                updateMenuStates();
                return;
            }

            try {
                showInfoReplace('Sistema', `Cargando red ${roadType}...`, 2000);
                
                const zipUrl = `Red_Vial_${roadType.charAt(0).toUpperCase() + roadType.slice(1)}.zip`;
                
                const response = await fetch(zipUrl);
                if (!response.ok) {
                    throw new Error(`No se pudo cargar ${zipUrl}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                const geojson = await shp(arrayBuffer);
                
                if (geojson && geojson.features && geojson.features.length > 0) {
                    await processCoordinates(geojson);
                    
                    loadedRoads[roadType] = geojson;
                    geojsonData = geojson;
                    
                    const lineFeatures = getLineFeatures();
                    showSuccessReplace('¡Completado!', `Red ${roadType} cargada (${lineFeatures.length} vías)`, 4000);
                    updateMenuStates();
                } else {
                    throw new Error('Datos inválidos en el shapefile');
                }

                showError('Error', `Error cargando red ${roadType}: ${error.message}`, 6000);
                geojsonData = null;

        // Procesar coordenadas
        async function processCoordinates(geojson) {
            const firstFeature = geojson.features.find(f => 
                f.geometry && f.geometry.coordinates && f.geometry.coordinates.length > 0
            );
            
            if (firstFeature) {
                let testCoord;
                if (firstFeature.geometry.type === 'LineString') {
                    testCoord = firstFeature.geometry.coordinates[0];
                } else if (firstFeature.geometry.type === 'MultiLineString') {
                    testCoord = firstFeature.geometry.coordinates[0][0];
                }
                
                if (testCoord && (Math.abs(testCoord[0]) > 180 || Math.abs(testCoord[1]) > 180)) {
                    geojson.features.forEach(feature => {
                        if (feature.geometry) {
                            convertCoordinates(feature.geometry);
                        }
                    });
                }
            }
        }

        function convertCoordinates(geometry) {
            if (geometry.type === 'LineString') {
                geometry.coordinates = geometry.coordinates.map(convertSingleCoordinate);
            } else if (geometry.type === 'MultiLineString') {
                geometry.coordinates = geometry.coordinates.map(line => 
                    line.map(convertSingleCoordinate)
                );
            }
        }

        function convertSingleCoordinate(coord) {
            const falseEasting = 1000000;
            const falseNorthing = 1000000;
            const centralMeridian = -74.077499;
            const latitudeOfOrigin = 4.596200;
            
            const x = coord[0] - falseEasting;
            const y = coord[1] - falseNorthing;
            
            const lon = centralMeridian + (x / 111320);
            const lat = latitudeOfOrigin + (y / 110540);
            
            return [lon, lat];
        }

        function getLineFeatures() {
            if (!geojsonData || !geojsonData.features) return [];
            return geojsonData.features.filter(feature => {
                const geomType = feature.geometry?.type;
                return geomType === 'LineString' || geomType === 'MultiLineString';
            });
        }

            const hasCoordinates = hasValidCoordinates();
            calculateBtn.disabled = !(hasData && hasCoordinates);

        function parseCoordinates() {
            const lonValue = longitudeInput.value.trim();
            const latValue = latitudeInput.value.trim();
            
            let longitude = null;
            let latitude = null;

            if (lonValue) {
                longitude = parseCoordinate(lonValue, 'longitude');
            }

            if (latValue) {
                latitude = parseCoordinate(latValue, 'latitude');
            }

            return { longitude, latitude };
        }

        function parseCoordinate(value, type) {
            value = value.trim();
            
            if (!isNaN(parseFloat(value)) && isFinite(value)) {
                return parseFloat(value);
            }

            const dmsPattern = /(\d+)[°º]?\s*(\d+)[''′]?\s*(\d+(?:\.\d+)?)[""″]?\s*([NSEW])?/i;
            let match = value.match(dmsPattern);
            
            if (!match) {
                const spacePattern = /(\d+)\s+(\d+)\s+(\d+(?:\.\d+)?)\s*([NSEW])?/i;
                match = value.match(spacePattern);
            }
            
            if (match) {
                const degrees = parseInt(match[1]);
                const minutes = parseInt(match[2]);
                const seconds = parseFloat(match[3]);
                const direction = match[4] ? match[4].toUpperCase() : '';

                let decimal = degrees + minutes/60 + seconds/3600;

                if (direction) {
                    if (direction === 'S' || direction === 'W') {
                        decimal = -decimal;
                    }
                } else {
                    if (type === 'longitude' && decimal > 0) {
                        decimal = -decimal;
                    }
                }

                return decimal;
            }

            const dirPattern = /(\d+(?:\.\d+)?)\s*([NSEW])/i;
            const dirMatch = value.match(dirPattern);
            
            if (dirMatch) {
                let decimal = parseFloat(dirMatch[1]);
                const direction = dirMatch[2].toUpperCase();
                
                if (direction === 'S' || direction === 'W') {
                    decimal = -decimal;
                }
                
                return decimal;
            }

            return null;
        }

        function calculateAbscissa() {
            const coords = parseCoordinates();
            const longitude = coords.longitude;
            const latitude = coords.latitude;

            if (longitude === null || latitude === null) {

                return;

            try {
                const lineFeatures = getLineFeatures();
                
                if (lineFeatures.length === 0) {

                    return;

                const result = findClosestRoadAndAbscissa([longitude, latitude], lineFeatures);

                    addRoadsToMap(lineFeatures, result);
                    addMarkersToMap([longitude, latitude], result.closestPoint, result);
                    
                    const bounds = L.latLngBounds([

                    updateMenuStates();
                    showSuccess('¡Completado!', 'Cálculo completado', 4000);

// Funciones matemáticas
        function haversineDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                     Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                     Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function pointToLineDistance(point, lineStart, lineEnd) {
            const A = point[0] - lineStart[0];
            const B = point[1] - lineStart[1];
            const C = lineEnd[0] - lineStart[0];
            const D = lineEnd[1] - lineStart[1];

            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            
            if (lenSq === 0) return Math.sqrt(A * A + B * B);
            
            let param = dot / lenSq;
            param = Math.max(0, Math.min(1, param));
            
            const xx = lineStart[0] + param * C;
            const yy = lineStart[1] + param * D;
            
            const dx = point[0] - xx;
            const dy = point[1] - yy;
            
            return {
                distance: Math.sqrt(dx * dx + dy * dy),
                closestPoint: [xx, yy],
                parameter: param
            };
        }

        function findClosestRoadAndAbscissa(point, features) {
            let closestRoad = null;
            let minDistance = Infinity;
            let bestResult = null;

            features.forEach((feature, roadIndex) => {
                try {
                    if (feature.geometry.type === 'LineString') {
                        processLineString(feature.geometry.coordinates, feature, roadIndex);
                    } else if (feature.geometry.type === 'MultiLineString') {
                        feature.geometry.coordinates.forEach((lineCoords, lineIndex) => {
                            const lineFeature = {
                                ...feature,
                                geometry: { type: 'LineString', coordinates: lineCoords }
                            };
                            processLineString(lineCoords, lineFeature, `${roadIndex}-${lineIndex}`);
                        });
                    }
                } catch (error) {
                    console.error(`Error procesando feature ${roadIndex}:`, error);
                }
            });

            function processLineString(coordinates, feature, roadId) {
                try {
                    if (!coordinates || coordinates.length < 2) return;

                    let roadDistance = 0;
                    let segmentDistances = [0];

                    for (let i = 1; i < coordinates.length; i++) {
                        const coord1 = coordinates[i-1];
                        const coord2 = coordinates[i];
                        
                        if (!coord1 || !coord2 || coord1.length < 2 || coord2.length < 2) continue;

                        const segmentDist = haversineDistance(
                            coord1[1], coord1[0],
                            coord2[1], coord2[0]
                        );
                        roadDistance += segmentDist;
                        segmentDistances.push(roadDistance);
                    }

                    for (let i = 0; i < coordinates.length - 1; i++) {
                        const coord1 = coordinates[i];
                        const coord2 = coordinates[i + 1];
                        
                        if (!coord1 || !coord2 || coord1.length < 2 || coord2.length < 2) continue;

                        const result = pointToLineDistance([point[0], point[1]], coord1, coord2);
                        const distanceToPoint = haversineDistance(
                            point[1], point[0],
                            result.closestPoint[1], result.closestPoint[0]
                        );

                        if (distanceToPoint < minDistance) {
                            minDistance = distanceToPoint;
                            
                            const segmentLength = haversineDistance(
                                coord1[1], coord1[0],
                                coord2[1], coord2[0]
                            );
                            const abscissa = segmentDistances[i] + (result.parameter * segmentLength);

                            bestResult = {
                                roadIndex: roadId,
                                feature: feature,
                                abscissa: abscissa,
                                totalRoadLength: roadDistance,
                                distanceToRoad: distanceToPoint,
                                closestPoint: result.closestPoint,
                                segmentIndex: i
                            };
                            closestRoad = feature;
                        }
                    }
                } catch (error) {
                    console.error(`Error en processLineString para road ${roadId}:`, error);
                }
            }

            return bestResult;
        }

        function handleDistanceMeasurement(point, latlng) {
            const marker = L.circleMarker(latlng, {

        function updateDistanceMeasurement() {
            if (measurementLine) {
                measurementLayer.removeLayer(measurementLine);

            const latLngs = measurementPoints.map(p => [p[1], p[0]]);
            measurementLine = L.polyline(latLngs, {

                weight: 3,
                dashArray: '5,5'
            });

            let totalDistance = 0;
            for (let i = 1; i < measurementPoints.length; i++) {
                const p1 = measurementPoints[i-1];
                const p2 = measurementPoints[i];
                totalDistance += haversineDistance(p1[1], p1[0], p2[1], p2[0]);
            }

            measurementDisplay.innerHTML = ` | L: ${(totalDistance / 1000).toFixed(3)} km`;

        function handleAreaMeasurement(point, latlng) {

                );

            }

        function updateAreaMeasurement() {
            if (measurementPolygon) {
                measurementLayer.removeLayer(measurementPolygon);
            }
            
            const latLngs = measurementPoints.map(p => [p[1], p[0]]);
            measurementPolygon = L.polygon(latLngs, {
                color: '#06b6d4',
                fillColor: '#06b6d4',
                fillOpacity: 0.2,
                weight: 2
            });
            measurementLayer.addLayer(measurementPolygon);

            const area = calculatePolygonArea(measurementPoints);

            if (area >= 1000000) {
                measurementDisplay.innerHTML = ` | A: ${(area / 1000000).toFixed(3)} km²`;
            } else {
                measurementDisplay.innerHTML = ` | A: ${area.toFixed(1)} m²`;
            }
            measurementDisplay.style.color = '#06b6d4';
            measurementDisplay.style.fontWeight = 'bold';
        }

        function calculatePolygonArea(points) {
            if (points.length < 3) return 0;
            
            const centerLat = points.reduce((sum, p) => sum + p[1], 0) / points.length;
            const metersPerDegreeLat = 111320;
            const metersPerDegreeLon = 111320 * Math.cos(centerLat * Math.PI / 180);
            
            const metersPoints = points.map(p => [
                p[0] * metersPerDegreeLon,
                p[1] * metersPerDegreeLat
            ]);
            
            let area = 0;
            for (let i = 0; i < metersPoints.length; i++) {
                const j = (i + 1) % metersPoints.length;
                area += metersPoints[i][0] * metersPoints[j][1];
                area -= metersPoints[j][0] * metersPoints[i][1];
            }
            
            return Math.abs(area) / 2;
        }

        // Función para copiar al portapapeles
        async function copyToClipboard(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    // Fallback para navegadores que no soportan clipboard API
                    const textArea = document.createElement('textarea');
                    textArea.value = text;
                    textArea.style.position = 'fixed';
                    textArea.style.left = '-999999px';
                    textArea.style.top = '-999999px';
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    document.execCommand('copy');
                    textArea.remove();
                }
                return true;
            } catch (err) {
                console.error('Error copiando al portapapeles:', err);
                showError('Error', 'No se pudieron copiar las coordenadas', 2000);
                return false;
            }
        }

                <div style="text-align: center;">
                    <i class="fas fa-copy"></i> <strong>Coordenadas copiadas</strong><br>
                    <code style="background: #f3f4f6; padding: 2px 6px; border-radius: 4px; font-size: 12px;">
                        ${coordText}
                    </code><br>
                    <small style="color: #666;">Formato: Longitud, Latitud</small>
                </div>
            `, {
                maxWidth: 250
            });
            
            markersLayer.addLayer(tempMarker);
            
            // Abrir el popup automáticamente
            tempMarker.openPopup();
            
            // Remover el marcador después de 4 segundos
            setTimeout(() => {
                markersLayer.removeLayer(tempMarker);
            }, 4000);
        }


        // ===========================
        // SISTEMA DE TEMA OSCURO
        // ===========================
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            
            // Guardar preferencia en localStorage
            localStorage.setItem('theme', newTheme);
            
            // Cambiar icono del botón
            const icon = document.querySelector('.theme-toggle i');
            icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            
            console.log(`🌙 Tema cambiado a: ${newTheme}`);
        }

        // Cargar tema guardado al iniciar
        function loadSavedTheme() {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            let themeToUse = savedTheme || (systemPrefersDark ? 'dark' : 'light');
            
            if (themeToUse === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                const icon = document.querySelector('.theme-toggle i');
                if (icon) icon.className = 'fas fa-sun';
            }
        }

        // Detectar cambios en preferencias del sistema
        window.matchMedia('(prefers-color-scheme: dark)').addListener(function(e) {
            if (!localStorage.getItem('theme')) {
                const newTheme = e.matches ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', newTheme);
                const icon = document.querySelector('.theme-toggle i');
                if (icon) icon.className = newTheme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        });

        // Cargar tema al iniciar la página
        document.addEventListener('DOMContentLoaded', loadSavedTheme);


    </script>
</body>
</html>
